<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Houspire</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color-scheme: light;
      background: linear-gradient(135deg, #f5f5f5 0%, #e5e5e5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 24px;
    }
    
    h1 {
      font-size: 28px;
      color: #171717;
      margin-bottom: 16px;
      font-weight: 700;
    }
    
    p {
      color: #525252;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      background: #171717;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    
    .btn:hover {
      background: #404040;
      transform: translateY(-2px);
    }
    
    .features {
      margin-top: 48px;
      text-align: left;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    
    .features h3 {
      font-size: 16px;
      color: #171717;
      margin-bottom: 16px;
      font-weight: 600;
    }
    
    .features ul {
      list-style: none;
    }
    
    .features li {
      padding: 8px 0;
      color: #525252;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .features li::before {
      content: "✓";
      color: #22c55e;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. Don't worry, you can continue
      browsing cached content or try reconnecting.
    </p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    
    <div class="features">
      <h3>While You're Offline</h3>
      <ul>
        <li>View previously loaded projects</li>
        <li>Browse cached images</li>
        <li>Read FAQ content</li>
        <li>Your data is safely stored</li>
      </ul>
    </div>
  </div>
</body>
</html>
